# Production stack for the VPS.
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Reads secrets from a .env file sitting next to this one (see .env.example).
# The app listens on 127.0.0.1:3000 only — Caddy terminates TLS in front of it
# rather than exposing the container port to the internet.

# Pinned so volume names never depend on the directory name. Without this,
# cloning into a differently-named folder silently creates empty volumes and
# looks exactly like data loss.
name: PROJECT_NAME

# Docker keeps container logs forever by default, and on a small VPS they end
# up filling the disk. Three rotated 10 MB files per container is plenty to
# debug from (`docker compose logs`) without that risk.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# Everything the app reads at runtime. The migrate service gets the same set:
# it evaluates the same Payload config, which checks these (src/env.ts).
x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
  NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-}
  SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?set EMAIL_FROM_ADDRESS in .env}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    logging: *logging
    # Deliberately no `ports:` — Postgres is reachable only over the compose
    # network, never from the public interface.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending Payload migrations, then exits. The app waits for
  # it to finish successfully before booting.
  migrate:
    build:
      context: .
      target: migrator
    restart: 'no'
    environment: *app-env
    # The migrator image also runs the backup scripts (it has the sources and
    # the Payload CLI), so it sees the uploads and a host folder for backups:
    #   docker compose -f docker-compose.prod.yml run --rm migrate pnpm backup:create
    volumes:
      - media:/app/media
      - ./backups:/app/backups
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy

  payload:
    build:
      context: .
      target: runner
      # Build-time because NEXT_PUBLIC_* is inlined, not read at runtime.
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?set NEXT_PUBLIC_SERVER_URL in .env}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment: *app-env
    volumes:
      - media:/app/media
    logging: *logging
    # Calls src/app/api/health from inside the container (Caddy hides the path
    # from the internet). Node rather than wget/curl, which the image may lack.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Terminates TLS and proxies to the app. Nothing else publishes a public port.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3. Harmless if the firewall drops it; clients fall back to TCP.
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
    # Waits for a passing healthcheck, so the first requests after a deploy
    # don't get 502s while Next boots.
    depends_on:
      payload:
        condition: service_healthy

volumes:
  pgdata:
  media:
  # Holds the certificates and the ACME account key. Losing it is not data loss
  # in the usual sense, but it forces re-issuance on every deploy, and Let's
  # Encrypt rate-limits duplicate certificates to five per week. Treat it as
  # something to keep, not a cache.
  caddy_data:
  caddy_config:
